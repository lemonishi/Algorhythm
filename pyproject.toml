[project]
name = "algorhythm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "textual>=0.79", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.24"]

[project.scripts]
algorhythm = "algorhythm.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["algorhythm*"]

# `packages.find` collects importable packages only, so these two directories
# ship nowhere without being named. Missing them yields an install where nvim
# `luafile`s a path that does not exist and every C++ compile fails on the
# include.
[tool.setuptools.package-data]
"algorhythm.editor" = ["lua/*.lua"]
"algorhythm.runner" = ["cpp/*.h"]
